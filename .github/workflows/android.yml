name: Android APK

# Test-Build (Debug-APK) bei jedem Push. Signierte Release-Versionen baut release.yml.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.0.${{ github.run_number }}-debug
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Web-App bauen und in das Android-Projekt kopieren
        run: npm run android:sync

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/OnlyWeather-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OnlyWeather-${{ env.VERSION_NAME }}
          path: out/*.apk
          if-no-files-found: error
