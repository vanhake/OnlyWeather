name: Release

# Signierte Release-Version bauen und als GitHub-Release veröffentlichen.
# Start: automatisch bei jedem Push auf main (z. B. Merge eines PRs) mit der nächsten Patch-Version
#    (v1.0.0 → v1.0.1), Tag pushen (git tag v1.1.0 && git push origin v1.1.0)
#    oder Actions → Release → "Run workflow" mit Versionsnummer.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer, z. B. 1.0.0'
        required: true
      prerelease:
        description: 'Als Vorabversion markieren'
        type: boolean
        default: false

permissions:
  contents: write

# Nacheinander, damit zwei schnelle Merges nicht dieselbe Versionsnummer berechnen
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Version bestimmen
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git fetch --quiet --force --tags origin
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Push auf main: Commit schon als Version getaggt (z. B. per Tag-Push)? Dann kein zweites Release.
            if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Commit ist bereits als $(git tag --points-at HEAD | head -1) veröffentlicht – kein neues Release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            LATEST="${LATEST:-v0.0.0}"
            IFS=. read -r MA MI PA <<< "${LATEST#v}"
            VERSION="$MA.$MI.$((PA + 1))"
            echo "Letzte Version $LATEST → $VERSION"
          fi
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Ungültige Versionsnummer '$VERSION' – erwartet wird MAJOR.MINOR.PATCH, z. B. 1.0.0"
            exit 1
          fi
          # versionCode muss bei jedem Update steigen: 1.2.3 → 1002003
          CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Den Tag v$VERSION gibt es bereits. Bitte eine höhere Versionsnummer wählen."
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (versionCode $CODE)"

  release:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Schutz: ohne Version nicht 40 s bauen und erst beim Release scheitern
      - name: Version vorhanden?
        env:
          VERSION: ${{ needs.version.outputs.name }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$VERSION" ] || [ -z "$TAG" ]; then
            echo "::error::Keine Versionsnummer aus dem Job „version“ erhalten."
            exit 1
          fi
          echo "Release $TAG"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Java zuerst, damit die Schlüsselprüfung vor dem langen Build läuft
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Signaturschlüssel prüfen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/check-release-keystore.sh "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Web-App bauen und in das Android-Projekt kopieren
        run: npm run android:sync

      - name: Signierte APK und App Bundle bauen
        working-directory: android
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Wie in check-release-keystore.sh: Leerzeichen und Zeilenumbrüche am Rand ignorieren
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            v="${!name}"
            v="${v#"${v%%[![:space:]]*}"}"
            export "$name=${v%"${v##*[![:space:]]}"}"
          done
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Signatur prüfen und Dateien benennen
        id: files
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$APK" ]; then
            echo "::error::Keine signierte APK erzeugt (app-release.apk fehlt) – Signaturkonfiguration prüfen."
            exit 1
          fi
          # Entscheidend ist der Exit-Code von apksigner; die Ausgabe nur filtern, nie verschlucken
          if ! SIGNERS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" 2>&1); then
            echo "$SIGNERS"
            echo "::error::Die Signatur der APK ist ungültig (apksigner verify)."
            exit 1
          fi
          echo "$SIGNERS" | grep -E "certificate (DN|SHA-256)" || echo "$SIGNERS"
          mkdir -p out
          cp "$APK" "out/OnlyWeather-$VERSION.apk"
          cp "$AAB" "out/OnlyWeather-$VERSION.aab"
          (cd out && sha256sum OnlyWeather-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OnlyWeather-${{ needs.version.outputs.name }}-release
          path: out/*
          if-no-files-found: error

      # gh statt einer Drittanbieter-Action: der Job hat contents: write und sah die
      # Signatur-Secrets, fremder Code soll hier nicht laufen.
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.name }}
          PRERELEASE: ${{ inputs.prerelease == true }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          **Installation auf Android:** \`OnlyWeather-$VERSION.apk\` herunterladen und öffnen
          (Installation aus unbekannten Quellen erlauben). Updates lassen sich direkt über eine ältere
          Release-Version installieren. Eine vorher installierte Debug-Version muss einmal deinstalliert werden.

          \`OnlyWeather-$VERSION.aab\` ist das App Bundle für den Google Play Store.
          Prüfsummen stehen in \`SHA256SUMS.txt\`.
          NOTES
          args=()
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" out/* \
            --target "$GITHUB_SHA" \
            --title "OnlyWeather $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${args[@]}"
